name: CI

on:
  push:
    branches:
      - main
      - new-backend
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.9
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.9"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Add package registries
        run: |
          julia --project=. -e '
            using Pkg
            installed = Set(registry.name for registry in Pkg.Registry.reachable_registries())
            "General" in installed || Pkg.Registry.add("General")
            "ACE" in installed || Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/ACEsuit/ACEregistry.git"))
          '

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
